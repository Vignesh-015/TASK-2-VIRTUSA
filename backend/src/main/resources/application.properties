# Real credentials go in application-local.properties (ignored by Git) or in the DB_USERNAME and DB_PASSWORD environment variables. Never commit a real password.

server.port=8080
server.servlet.context-path=/api

spring.application.name=ems-backend

spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# JWT Configuration
# Dev default secret: at least 32 characters for HMAC-SHA256. Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:ems-dev-only-secret-change-me-0123456789-abcdefghij}
app.jwt.expiration-minutes=120

# Development only: seeds the 3 pre-configured demo accounts (admin, hr, employee)
app.seed-demo-accounts=true

spring.config.import=optional:classpath:application-local.properties
