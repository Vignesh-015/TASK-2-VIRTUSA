# Real credentials go in application-local.properties (ignored by Git) or in the DB_USERNAME and DB_PASSWORD environment variables. Never commit a real password.

server.port=8080
server.servlet.context-path=/api

spring.application.name=ems-backend

spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.config.import=optional:classpath:application-local.properties
